# Refreshes the "New on OTT this week" strip every morning on GitHub's servers (no computer needed).
# If the list changed, it commits to main, and Cloudflare Pages publishes it as usual.
# Run it by hand from GitHub → Actions → "Refresh New on OTT" → Run workflow.
name: Refresh New on OTT

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh-new-on-ott.mjs
      - .github/workflows/refresh-new-on-ott.yml

permissions:
  contents: write

concurrency:
  group: refresh-new-on-ott
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh the list
        run: node scripts/refresh-new-on-ott.mjs

      - name: Commit and push if it changed
        run: |
          if git diff --quiet; then
            echo "Nothing new today."
            exit 0
          fi
          git config user.name "masala-mischief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh New on OTT ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin main
