# Keeps the "Movies & series" catalogue up to date from TMDB (scripts/build-catalog.mjs, TMDB_TOKEN secret):
#   - every day (Mon–Sat): a quick run that adds new releases and refreshes Trending (a few minutes)
#   - Sundays: the full run that re-ranks everything, adds new titles, and refreshes recent titles plus a
#     quarter of the older ones (about 20–40 min; the first run after a big change takes an hour or two)
# Commits only if something changed; Cloudflare Pages publishes it as usual.
# Run it by hand from GitHub → Actions → "Catalogue" → Run workflow (choose quick or full).
name: Catalogue

on:
  schedule:
    - cron: "0 2 * * 0"   # Sundays 07:30 IST: full rebuild
    - cron: "0 2 * * 1-6" # other days 07:30 IST: new releases only
  workflow_dispatch:
    inputs:
      mode:
        description: "quick = add new releases only, full = rebuild everything"
        type: choice
        options: [quick, full]
        default: quick
  push:
    branches: [main]
    paths:
      - scripts/build-catalog.mjs
      - .github/workflows/weekly-catalog.yml

permissions:
  contents: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # the first run after a big plan change fetches every title (an hour or two)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Full on the Sunday schedule, when chosen by hand, or when the build itself changed (a push);
      # quick on the other days.
      - name: Choose quick or full
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 2 * * 0" ] || [ "${{ inputs.mode }}" = "full" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the catalogue (${{ steps.mode.outputs.mode }})
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          CATALOG_MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/build-catalog.mjs

      # Stops the run (nothing is committed) if the build lost a big part of the catalogue or of one app; anything
      # smaller is a warning in the run's summary (scripts/check-catalog.mjs).
      - name: Check the catalogue
        run: node scripts/check-catalog.mjs

      - name: Commit and push if it changed
        run: |
          git add -A assets/catalog
          if git diff --cached --quiet; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git config user.name "masala-mischief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then what="Weekly catalogue"; else what="New releases"; fi
          git commit -m "$what ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin main

      # Our own copy of the catalogue in D1, with each title's app history (scripts/sync-catalog-db.mjs). A problem here
      # (the site not deployed yet, the database busy) must not stop the catalogue itself, so it never fails the run.
      - name: Save to the catalogue database
        continue-on-error: true
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/sync-catalog-db.mjs
