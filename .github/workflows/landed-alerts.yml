# Every day about 10 am India time, after the morning catalogue build has been published: tells people who
# tapped "Tell me when it's on OTT" on a film that it's now on an app (scripts/send-alerts.mjs with
# ALERT_KIND=landed). Needs the ADMIN_PASSWORD repository secret (same value as in Cloudflare).
# Run it by hand from GitHub → Actions → "Film landed alerts" → Run workflow.
name: Film landed alerts

on:
  schedule:
    - cron: "37 4 * * *" # about 10:07 IST, after the catalogue and the daily update
  workflow_dispatch:
  # Right after the Daily site update (which ends by checking the new data is live), so it doesn't depend on a second scheduled start.
  workflow_run:
    workflows: ["Daily site update"]
    types: [completed]

permissions:
  contents: read

jobs:
  send:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Send "now on OTT" alerts
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ALERT_KIND: landed
        run: node scripts/send-alerts.mjs
